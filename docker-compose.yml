version: "3.9"

services:
  # ── Backend (FastAPI + Uvicorn) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantara-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  # ── Frontend (React + Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantara-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
