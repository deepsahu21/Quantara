# ── Secrets (base64-encode your values before applying) ───────────
#
# Create with:
#   kubectl create secret generic quantara-secrets \
#     --namespace=quantara \
#     --from-literal=FINNHUB_API_KEY=your_key_here
#
# Or apply this file after encoding:
#   echo -n "your_key_here" | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: quantara-secrets
  namespace: quantara
type: Opaque
data:
  FINNHUB_API_KEY: <BASE64_ENCODED_KEY>
