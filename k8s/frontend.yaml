# ── Frontend Deployment & Service ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantara-frontend
  namespace: quantara
  labels:
    app: quantara
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantara
      tier: frontend
  template:
    metadata:
      labels:
        app: quantara
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: quantara-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: quantara
spec:
  selector:
    app: quantara
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
