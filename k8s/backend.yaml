# ── Backend Deployment & Service ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantara-backend
  namespace: quantara
  labels:
    app: quantara
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantara
      tier: backend
  template:
    metadata:
      labels:
        app: quantara
        tier: backend
    spec:
      containers:
        - name: backend
          image: quantara-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: quantara-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/tickers
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tickers
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: quantara
spec:
  selector:
    app: quantara
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
