# ── Ingress (optional — use if you have an ingress controller) ────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantara-ingress
  namespace: quantara
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: quantara.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
